version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jungle_gaming
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  localstack:
    image: localstack/localstack:3.7
    ports:
      - "4566:4566"
    environment:
      SERVICES: sqs
      EDGE_PORT: 4566
    volumes:
      - localstack-data:/var/lib/localstack

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev --http-port=8081 --hostname-strict=false
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8081"

  app:
    build: .
    depends_on:
      - postgres
      - localstack
      - keycloak
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/jungle_gaming
      SQS_QUEUE_URL: http://localstack:4566/000000000000/betting-events
      OIDC_ISSUER_URL: http://keycloak:8081/realms/jungle
      OIDC_AUDIENCE: jungle-gaming
    ports:
      - "8080:8080"

volumes:
  pgdata:
  localstack-data:
